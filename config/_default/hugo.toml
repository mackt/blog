# -- Site Configuration --

baseURL = "https://mack.ma/"
defaultContentLanguage = "zh-Hans"
theme = "kami"

enableRobotsTXT = true
summaryLength = 0

# Suppress auto-generated taxonomies we don't use (kami uses tags only)
disableKinds = []
[taxonomies]
  tag = "tags"

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS"]

[privacy]
  [privacy.vimeo]
    enableDNT = true
  [privacy.x]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true

[services]
  [services.x]
    disableInlineCSS = true
